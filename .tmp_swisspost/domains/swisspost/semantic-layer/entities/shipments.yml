name: shipments
type: fact_table
table: public.shipments
grain: one row per parcel or letter (~30 rows in demo dataset)
description: |
  Every parcel and letter in the system with current status, applied tariff,
  origin service point, destination canton/city, weight, timestamps and delay reason.
  Primary operational grain — most SLA and volume questions land here.
use_for:
  - Volume queries by canton, customer, service_label or day.
  - Status distribution (lodged / in_transit / out_for_delivery / delivered / returned / delayed).
  - On-time-rate calculation.
  - Delay-cause analysis (delayed_reason).
  - Joining to customers, tariffs, and origin service_points.
do_not_use_for:
  - Tariff prices (see tariffs).
  - Customer profiles / annual revenue (see customers).
sample_questions:
  - Wie viele Priority-Pakete sind aktuell in Zustellung?
  - Delay-Ursachen der letzten 7 Tage?
  - Top-Kunden nach on-time rate?
joins:
  - target_entity: customers
    relationship: many_to_one
    join_columns:
      from: customer_id
      to: id
  - target_entity: tariffs
    relationship: many_to_one
    join_columns:
      from: tariff_id
      to: id
  - target_entity: service_points
    relationship: many_to_one
    join_columns:
      from: origin_sp_id
      to: id
dimensions:
  - name: id
    sql: id
    type: string
    description: Tracking number, e.g. "PP-2026-100012".
  - name: customer_id
    sql: customer_id
    type: string
    description: FK to customers.id.
  - name: tariff_id
    sql: tariff_id
    type: string
    description: FK to tariffs.id — the service/weight-band applied.
  - name: origin_sp_id
    sql: origin_sp_id
    type: string
    description: FK to service_points.id — where the shipment was lodged.
  - name: destination_canton
    sql: destination_canton
    type: string
    description: Two-letter canton code of the destination.
    profile:
      sample_values: [ZH, BE, VD, GE, BS, TI, AG, SG, LU, TG]
  - name: destination_city
    sql: destination_city
    type: string
  - name: status
    sql: status
    type: string
    description: lodged | in_transit | out_for_delivery | delivered | returned | delayed
    profile:
      sample_values: [delivered, in_transit, out_for_delivery, lodged, delayed, returned]
  - name: delayed_reason
    sql: delayed_reason
    type: string
    description: Nullable. weather | staffing | address_issue | customs | other
    profile:
      sample_values: [weather, staffing, address_issue, null]
  - name: service_label
    sql: service_label
    type: string
    description: Denormalized human label of the applied tariff service (e.g. "PostPac Priority") — grep-friendly.
measures:
  - name: weight_g
    sql: weight_g
    type: sum
    description: Shipment weight in grams.
  - name: is_on_time
    sql: is_on_time
    type: avg
    description: |
      Boolean flag — true if delivered within the tariff's transit target.
      Cast to 0/1 in SQL for rate calculations.
  - name: lodged_at
    sql: lodged_at
    type: timestamp
  - name: delivered_at
    sql: delivered_at
    type: timestamp
