# Swiss Post canonical metrics — the model reads this before writing SQL.
# Every KPI a Kunden-/Filiale-/Kommunikations-Persona might ask for should be
# defined here in one place so answers stay consistent across turns.

metrics:
  # ---------- operational SLA -----------------------------------------
  - name: on_time_rate
    label: On-time rate
    description: |
      Share of delivered shipments that arrived within the tariff's
      transit_days_target — i.e. shipments.is_on_time = true, expressed 0-100.
    unit: percent
    sql_hint: |
      SELECT 100.0 * AVG(CASE WHEN is_on_time THEN 1 ELSE 0 END) AS on_time_rate
      FROM public.shipments
      WHERE status = 'delivered';
    grain: shipments
    good_direction: up

  - name: delayed_share
    label: Delayed share
    description: |
      Share of all currently non-delivered shipments whose status = 'delayed'.
    unit: percent
    sql_hint: |
      SELECT 100.0 * SUM(CASE WHEN status = 'delayed' THEN 1 ELSE 0 END)
        / NULLIF(COUNT(*), 0) AS delayed_share
      FROM public.shipments;
    grain: shipments
    good_direction: down

  - name: delay_cause_mix
    label: Delay causes
    description: |
      Distribution of shipments.delayed_reason among delayed / late shipments.
    unit: count
    sql_hint: |
      SELECT delayed_reason, COUNT(*) AS n
      FROM public.shipments
      WHERE delayed_reason IS NOT NULL
      GROUP BY 1 ORDER BY n DESC;
    grain: shipments

  # ---------- volume --------------------------------------------------
  - name: shipment_volume
    label: Sendungs-Volumen
    description: |
      Count of shipments in a filter window. Group by canton, customer,
      service_label or day as needed.
    unit: count
    sql_hint: |
      SELECT COUNT(*) FROM public.shipments
      WHERE lodged_at >= now() - interval '30 days';
    grain: shipments

  - name: monthly_customer_volume_k
    label: Monatliches Kundenvolumen (k)
    description: |
      Customer's average monthly shipments in thousands — customers.monthly_volume_k.
      Use this for portfolio views; use shipments COUNT for actuals.
    unit: k_shipments
    sql_hint: |
      SELECT id, name, monthly_volume_k
      FROM public.customers
      ORDER BY monthly_volume_k DESC;
    grain: customers

  # ---------- revenue -------------------------------------------------
  - name: customer_annual_revenue_chf
    label: Jahresumsatz pro Kunde (CHF)
    description: |
      Annual revenue Swiss Post bills the customer (customers.annual_revenue_chf).
    unit: CHF
    sql_hint: |
      SELECT id, name, annual_revenue_chf
      FROM public.customers
      ORDER BY annual_revenue_chf DESC;
    grain: customers

  - name: revenue_by_industry
    label: Umsatz pro Branche
    description: |
      Sum of annual_revenue_chf grouped by customers.industry.
    unit: CHF
    sql_hint: |
      SELECT industry, SUM(annual_revenue_chf) AS revenue_chf
      FROM public.customers
      GROUP BY 1 ORDER BY revenue_chf DESC;
    grain: customers

  # ---------- risk ----------------------------------------------------
  - name: at_risk_customer_count
    label: At-Risk Kunden
    description: |
      Number of customers with contract_status = 'at_risk' OR churn_risk_score > 40.
    unit: count
    sql_hint: |
      SELECT COUNT(*)
      FROM public.customers
      WHERE contract_status = 'at_risk' OR churn_risk_score > 40;
    grain: customers

  - name: churn_risk_top10
    label: Top-10 Churn-Risiko
    description: |
      Ten customers with highest churn_risk_score.
    unit: score
    sql_hint: |
      SELECT id, name, segment, industry, churn_risk_score, annual_revenue_chf
      FROM public.customers
      ORDER BY churn_risk_score DESC
      LIMIT 10;
    grain: customers

  # ---------- editorial ----------------------------------------------
  - name: incoming_pages_by_priority
    label: Eingehende Service-Pages nach Priorität
    description: |
      Count of service_pages with status = 'incoming' grouped by priority.
    unit: count
    sql_hint: |
      SELECT priority, COUNT(*) AS n
      FROM public.service_pages
      WHERE status = 'incoming'
      GROUP BY 1;
    grain: service_pages

  - name: top_relevance_incoming
    label: Top-Relevanz eingehende Pages
    description: |
      Ten highest-relevance incoming service_pages, newest first.
    unit: percent
    sql_hint: |
      SELECT id, headline, category, priority, relevance_pct
      FROM public.service_pages
      WHERE status = 'incoming'
      ORDER BY relevance_pct DESC NULLS LAST, id
      LIMIT 10;
    grain: service_pages
