metrics:
  perfect_store_rate:
    definition: Share of completed visits with perfect_store_score >= 90.
    sql_hint: 100.0 * count(*) FILTER (WHERE perfect_store_score >= 90) / NULLIF(count(*),0)
  on_shelf_availability:
    definition: Average store-SKU on-shelf availability percentage.
    sql_hint: avg(on_shelf_availability_pct)
  planogram_compliance:
    definition: Share of store-SKU rows marked planogram compliant.
    sql_hint: 100.0 * count(*) FILTER (WHERE planogram_compliant) / NULLIF(count(*),0)
  priority_sku_execution:
    definition: Priority SKUs with availability >= 95 and facings >= target.
    sql_hint: 100.0 * count(*) FILTER (WHERE priority AND on_shelf_availability_pct >= 95 AND facings >= target_facings) / NULLIF(count(*) FILTER (WHERE priority),0)
  visit_completion:
    definition: Share of visits with status completed.
    sql_hint: 100.0 * count(*) FILTER (WHERE status = 'completed') / NULLIF(count(*),0)
  assignment_completion:
    definition: Share of assignments completed.
    sql_hint: 100.0 * count(*) FILTER (WHERE status = 'completed') / NULLIF(count(*),0)
  sales_trend:
    definition: Latest weekly unit trend versus prior comparison period.
    sql_hint: avg(sales_trend_pct)
  agreement_compliance:
    definition: Store-SKU records meeting active required-facing clauses.
    sql_hint: 100.0 * count(*) FILTER (WHERE facings >= required_facings) / NULLIF(count(*),0)
