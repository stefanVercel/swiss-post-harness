name: service_pages
type: fact_table
table: public.service_pages
grain: one row per source item for a post.ch service page (15 rows in demo dataset)
description: |
  Editorial source items feeding the post.ch Kommunikations-Workflow —
  tariff updates, disruption bulletins, how-tos, holiday schedules,
  product launches and policy notes. Each row has category, source
  department, editorial priority and a 0-100 relevance score.

  Analog of the `wire_stories` table in the P7S1 harness — the article-drafter
  skill drafts from here, and the durable editorial-review workflow suspends
  on human approval before publish.
use_for:
  - Editorial backlog and draft pipeline (filter status).
  - Ranking by priority + relevance_pct for triage.
  - Trigger for article-drafter and article-reviser skills.
do_not_use_for:
  - Already-published article metrics (out of scope).
  - Underlying disruption facts (see service_disruptions).
sample_questions:
  - Welche High-Priority Service-Pages sind noch nicht publiziert?
  - Ranking der eingehenden Störungs-Meldungen nach relevance_pct?
  - Welche Drafts stecken aktuell im Review?
joins:
  - target_entity: service_disruptions
    relationship: many_to_one
    join_columns:
      from: related_disruption_id
      to: id
  - target_entity: tariffs
    relationship: many_to_one
    join_columns:
      from: related_tariff_id
      to: id
dimensions:
  - name: id
    sql: id
    type: string
    profile:
      distinct_count: 15
  - name: category
    sql: category
    type: string
    profile:
      sample_values: [tariffs, disruptions, how_to, holidays, product_launch, policy]
  - name: headline
    sql: headline
    type: string
  - name: source
    sql: source
    type: string
    profile:
      sample_values: [internal_ops, pr, product, disruption_desk]
  - name: status
    sql: status
    type: string
    profile:
      sample_values: [incoming, drafting, in_review, published]
  - name: priority
    sql: priority
    type: string
    profile:
      sample_values: [low, medium, high]
measures:
  - name: relevance_pct
    sql: relevance_pct
    type: avg
    description: Editorial-scored 0-100 relevance for post.ch readers.
  - name: published_at
    sql: published_at
    type: timestamp
