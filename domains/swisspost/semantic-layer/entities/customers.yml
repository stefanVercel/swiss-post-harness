name: customers
type: dim_table
table: public.customers
grain: one row per billed customer (8 rows in demo dataset)
description: |
  Principals Swiss Post bills — private (PK), small/medium business (KMU) and
  enterprise (GK). Each has segment, industry, primary canton, average monthly
  shipment volume, annual revenue to Swiss Post, a key-account flag, contract
  status and a churn risk score.
use_for:
  - Portfolio views (rank by volume, revenue, or risk).
  - Filter by segment (pk/kmu/gk), industry, or key-account status.
  - Joining to shipments to compute per-customer SLA or delay stats.
  - Risk analysis (contract_status = 'at_risk', churn_risk_score > 40).
do_not_use_for:
  - Individual shipment records (see shipments).
  - Tariff pricing (see tariffs).
sample_questions:
  - Welche GK-Kunden haben das grösste Volumen?
  - Welche Kunden sind at_risk oder haben churn_risk_score > 50?
  - Umsatz-Top-5 nach Branche?
joins:
  - target_entity: shipments
    relationship: one_to_many
    join_columns:
      from: id
      to: customer_id
dimensions:
  - name: id
    sql: id
    type: string
    description: Slug primary key.
    profile:
      distinct_count: 8
      sample_values: [digitec-galaxus, zalando-ch, migros, coop, nestle-ch, abb-ch, postfinance, kmu-brack]
  - name: name
    sql: name
    type: string
  - name: segment
    sql: segment
    type: string
    description: pk | kmu | gk
    profile:
      sample_values: [gk, kmu]
  - name: industry
    sql: industry
    type: string
    profile:
      sample_values: [e-commerce, retail, cpg, industrial, finance]
  - name: primary_canton
    sql: primary_canton
    type: string
  - name: is_key_account
    sql: is_key_account
    type: boolean
    description: True if handled by a Key Account Manager.
  - name: contract_status
    sql: contract_status
    type: string
    profile:
      sample_values: [active, at_risk, renewal_due, churned]
measures:
  - name: monthly_volume_k
    sql: monthly_volume_k
    type: sum
    description: Thousands of shipments per month (customer average).
  - name: annual_revenue_chf
    sql: annual_revenue_chf
    type: sum
    description: Annual revenue Swiss Post bills the customer, in CHF.
  - name: churn_risk_score
    sql: churn_risk_score
    type: avg
    description: 0-100. Higher = more at risk.
