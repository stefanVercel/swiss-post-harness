name: service_points
type: dim_table
table: public.service_points
grain: one row per Swiss Post physical location (8 rows in demo dataset)
description: |
  Physical network of Swiss Post locations across Switzerland — staffed Filialen,
  Agenturen (retail partners), My Post 24 lockers (24/7 automated) and Business Centers.
  Includes opening hours per weekday bucket, offered services, weekly foot traffic and
  SLA attainment.
use_for:
  - Location lookups by canton / city / postal code / opening hours.
  - Filter by offered services (parcel, letter, cash, id_check, packstation).
  - SLA rankings across the network.
  - Joining shipments to their origin service point.
do_not_use_for:
  - Individual shipment status (see shipments).
  - Customer billing data (see customers).
sample_questions:
  - Welche Filialen in Zürich haben nach 18:00 offen?
  - Welche Standorte in der Romandie bieten Bargeldbezug?
  - Ranking der Filialen nach on_time_pct?
joins:
  - target_entity: shipments
    relationship: one_to_many
    join_columns:
      from: id
      to: origin_sp_id
dimensions:
  - name: id
    sql: id
    type: string
    description: URL-slug primary key, e.g. "zh-sihlpost".
    profile:
      distinct_count: 8
      sample_values: [zh-sihlpost, be-schanzenpost, ge-rive, vd-lausanne-stf, ti-lugano-hb, zh-mypost24-flughafen]
  - name: name
    sql: name
    type: string
    description: Full location name (typically "<city> <landmark>").
  - name: kind
    sql: kind
    type: string
    description: filiale | agentur | mypost24 | business_center
    profile:
      sample_values: [filiale, mypost24]
  - name: canton
    sql: canton
    type: string
    description: Two-letter canton code — ZH, BE, VD, GE, BS, TI, ...
    profile:
      sample_values: [ZH, BE, VD, GE, BS, TI]
  - name: city
    sql: city
    type: string
  - name: postal_code
    sql: postal_code
    type: string
  - name: opens_mon_fri
    sql: opens_mon_fri
    type: string
    description: |
      Weekday opening window as "HH:MM-HH:MM". Null = closed.
      For "after 18:00" queries use SUBSTRING(opens_mon_fri, 7, 5) > '18:00'.
  - name: opens_sat
    sql: opens_sat
    type: string
  - name: opens_sun
    sql: opens_sun
    type: string
  - name: services
    sql: services
    type: array_string
    description: Postgres text[] of offered services.
    profile:
      sample_values: [parcel, letter, cash, id_check, packstation]
  - name: status
    sql: status
    type: string
    description: active | temporarily_closed | closed
measures:
  - name: weekly_visits_k
    sql: weekly_visits_k
    type: sum
    description: Average thousands of customer visits per week.
  - name: on_time_pct
    sql: on_time_pct
    type: avg
    description: SLA attainment 0-100 — share of shipments dispatched from this location that were on time.
