domain: red_bull_field_sales
notice: All records and figures are synthetic demo data.
entities:
  markets: market configuration
  retail_accounts: retailer and channel hierarchy
  stores: outlet profile and priority
  products: SKU master and priority flag
  store_product_performance: weekly store-SKU execution grain
  key_account_agreements: active retailer commitments
  routes: daily owner route
  route_stops: ordered outlets and objectives
  store_visits: visit history and perfect-store score
  visit_assignments: executable tasks and completion
  huddle_briefings: dated market priorities
  pocket_guide_entries: approved execution knowledge
  market_playbooks: governed targeting rules and versions
joins:
  - stores.account_id = retail_accounts.id
  - retail_accounts.market_id = markets.id
  - store_product_performance.store_id = stores.id
  - store_product_performance.product_id = products.id
  - key_account_agreements.account_id = retail_accounts.id
  - route_stops.route_id = routes.id
  - route_stops.store_id = stores.id
  - store_visits.store_id = stores.id
  - visit_assignments.store_id = stores.id
