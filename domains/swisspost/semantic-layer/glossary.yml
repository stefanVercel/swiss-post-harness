terms:
  Striker: field sales representative executing store visits
  ASM: Area Sales Manager responsible for route readiness and huddles
  DSM: District Sales Manager setting market priorities
  FAM: Field Application Manager governing playbooks
  outlet: stores
  priority SKU: products.priority = true
  OSA: store_product_performance.on_shelf_availability_pct
  facing gap: facings < target_facings
  perfect store: store_visits.perfect_store_score >= 90
  open task: visit_assignments.status = 'open'
  playbook: versioned targeting rules in market_playbooks
  agreement clause: active key_account_agreements row
